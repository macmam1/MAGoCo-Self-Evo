[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/tmp/nginx_err.log
stdout_logfile=/tmp/nginx_out.log
priority=10

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/home/user/app
autostart=true
autorestart=true
stderr_logfile=/tmp/backend_err.log
stdout_logfile=/tmp/backend_out.log
environment=PYTHONUNBUFFERED="1"
priority=20

[program:gradio]
command=python /home/user/app/gradio_app.py
directory=/home/user/app
autostart=true
autorestart=true
stderr_logfile=/tmp/gradio_err.log
stdout_logfile=/tmp/gradio_out.log
environment=BACKEND_URL="http://127.0.0.1:8000",GRADIO_SERVER_PORT="7861"
priority=30
