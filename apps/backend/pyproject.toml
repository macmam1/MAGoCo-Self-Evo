[project]
name = "magoco-backend"
version = "0.1.0"
description = "MAGoCo-Self-Evo Backend API"
authors = [
    { name = "MAGoCo Team" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ===== Core =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",

    # ===== Database =====
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",

    # ===== Cache & Queue =====
    "redis>=5.2.0",
    "celery>=5.4.0",

    # ===== Auth =====
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # ===== Agent Framework =====
    "crewai>=0.86.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",

    # ===== LLM Providers =====
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "huggingface-hub>=0.26.0",

    # ===== Storage =====
    "boto3>=1.35.0",  # S3
    "google-cloud-storage>=2.18.0",  # GCS
    "datasets>=3.2.0",  # HF Datasets

    # ===== Vector DB =====
    "qdrant-client>=1.12.0",
    "chromadb>=0.5.0",

    # ===== Utilities =====
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",

    # ===== Security =====
    "cryptography>=43.0.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
