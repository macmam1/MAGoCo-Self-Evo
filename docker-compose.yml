version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: magoco_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./magoco.db
      - DEBUG=true
    volumes:
      - backend_data:/app/apps/backend
    networks:
      - magoco_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    container_name: magoco_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - magoco_net

volumes:
  backend_data:

networks:
  magoco_net:
    driver: bridge