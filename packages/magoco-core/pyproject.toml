[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magoco-core"
version = "0.1.0"
description = "MAGoCo-Self-Evo core engine: Agents, Tools, Memory, ReAct, Security"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "semver>=3.0.0",
    "cryptography>=43.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["magoco_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]